<?xml version='1.0' encoding='utf-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">


    <ui:composition template="/template/template.xhtml">

        <ui:define name="growl"></ui:define>

        <ui:define name="content">

            <h1>#{msgs['regional.distribuition']}</h1>
            <h:form styleClass="container">
                
                <h:panelGrid columns="1" id="tudo" styleClass="container" >

                    <p:outputLabel value="#{msgs['empty']}" rendered="#{regionDistribuitionController.chartEmpty}" />

                    <p:barChart id="horizontal" model="#{regionDistribuitionController.barModel}"
                                rendered="#{regionDistribuitionController.hasData}"
                                style="width:100%;height:400px" />
                    <p:dataTable id="regions"
                                 emptyMessage="#{msgs['no.brazilian']}" var="pair"
                                 value="#{regionDistribuitionController.pairs}">

                        <p:column headerText="#{msgs['region']}">
                            <h:outputText value="#{pair.key}" />
                        </p:column>

                        <p:column headerText="#{msgs['documents.number']}">
                            <h:outputText value="#{pair.value}" />
                        </p:column>

                    </p:dataTable>



                </h:panelGrid>
            </h:form>

        </ui:define>

    </ui:composition>
</html>
