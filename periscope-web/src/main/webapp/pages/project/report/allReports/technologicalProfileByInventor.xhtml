<?xml version='1.0' encoding='utf-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:i="http://www.periscope.com/jsf">


    <ui:composition template="/template/template.xhtml">

        <ui:define name="growl"></ui:define>

        <ui:define name="content">

            <center><h1>#{msgs['technological.profile.inventor']}</h1></center>

            <h:form id="chart" styleClass="container">

                <i:filtro controller="#{mainIPCController}" inventorAutoComplete="true" ipcBooleanCheckBox="true"  filter="8"/>

                <h:panelGrid id="tudo" columns="2" styleClass="container">

                    <p:outputLabel value="#{msgs['empty']}" rendered="#{mainIPCController.chartEmpty}" />

                    <p:barChart id="horizontal" model="#{mainIPCController.barModel}"
                                rendered="#{mainIPCController.hasData}"
                                style="width:100%;height:400px" />

                    <h:column>
                        <p:graphicImage />
                        <p:graphicImage />
                    </h:column>

                    <h:column>

                        <p:dataTable id="datatable"
                                     emptyMessage="#{msgs['no.classifications']}" var="ipc"
                                     value="#{mainIPCController.pairs}" >

                            <p:column headerText="#{msgs['classification']}">
                                <h:outputText value="#{ipc.key}" />
                            </p:column>

                            <p:column headerText="#{msgs['description']}" rendered="#{mainIPCController.description}">
                                <h:outputText value="#{ipc.description}" />
                            </p:column>

                            <p:column headerText="#{msgs['documents.number']}">
                                <h:outputText value="#{ipc.value}" />
                            </p:column>

                        </p:dataTable>
                    </h:column>

                </h:panelGrid>
            </h:form>

        </ui:define>

    </ui:composition>
</html>
