<?xml version='1.0' encoding='utf-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui">


<ui:composition template="/template/template.xhtml">

	<ui:define name="growl"></ui:define>

	<ui:define name="content">

		<center><h1>#{msgs['main.classification']}</h1></center>
		<br/>
		<h:form id="chart" styleClass="container">
			<h:panelGrid columns="2" id="tudo" styleClass="container">

				<h:column>
					<p:outputLabel value="#{msgs['empty']}" rendered="#{mainClassificationController.chartEmpty}" />
					<p:tagCloud model="#{mainClassificationController.tagCloudModel}"
							   rendered="#{mainClassificationController.hasData}" />
				</h:column>

				<h:column>
					<p:dataTable emptyMessage="#{msgs['no.classifications']}"
								 var="pair" value="#{mainClassificationController.pairs}">

						<p:column headerText="#{msgs['classification']}">
							<h:outputText value="#{pair.key}" />
						</p:column>

						<p:column headerText="#{msgs['documents.number']}">
							<h:outputText value="#{pair.value}" />
						</p:column>

					</p:dataTable>
				</h:column>

			</h:panelGrid>
		</h:form>

	</ui:define>

</ui:composition>
</html>
