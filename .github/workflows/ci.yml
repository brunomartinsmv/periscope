name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Maven verify (unit tests)
        run: mvn -B clean verify

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Maven verify with IT profile
        run: mvn -B verify -Pit

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: periscope-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: periscope-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run dependency-check
        run: mvn -B org.owasp:dependency-check-maven:check
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/dependency-check-report.html
            **/dependency-check-report.json
            target/dependency-check-report.*
          if-no-files-found: warn

  # Disabled by default: requires WildFly + MongoDB on the runner.
  # Enable manually via Actions → CI → Run workflow (workflow_dispatch).
  e2e:
    name: E2E Playwright (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: periscope-ui/package-lock.json

      - name: Build WAR
        run: mvn -B clean package -DskipTests
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build SPA into WAR webapp
        working-directory: periscope-ui
        run: |
          npm ci
          npm run build:war
          cd ..
          mvn -B -pl periscope-web -am package -DskipTests

      - name: Enable MicroProfile OpenAPI on WildFly
        run: |
          # Placeholder: when WildFly is installed on the runner, run:
          #   JBOSS_HOME=... ./tools/enable-wildfly-openapi.sh
          echo "Configure WildFly OpenAPI via tools/enable-wildfly-openapi.sh before starting the server"

      - name: Start WildFly (documentado — ajuste paths no runner self-hosted)
        run: |
          echo "Steps expected when enabling E2E on a self-hosted / custom runner:"
          echo "  1. Install WildFly 34 + JDK 21"
          echo "  2. ./tools/enable-wildfly-openapi.sh"
          echo "  3. mkdir -p /opt/periscope && standalone.sh -b 0.0.0.0"
          echo "  4. cp periscope-web/target/periscope.war \$JBOSS_HOME/standalone/deployments/"
          echo "  5. wait for /periscope/rest/health"
          echo "Skipping actual start on ubuntu-latest (no WildFly image baked in)."
          exit 1

      - name: Install Playwright Chromium
        working-directory: periscope-ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: periscope-ui
        env:
          E2E_BASE_URL: http://localhost:8080/periscope/app/
          MONGODB_URI: mongodb://localhost:27017
        run: npm run test:e2e
