# Template INERTE de deploy para homologação futura.
# NÃO roda automaticamente: apenas workflow_dispatch, e o job principal tem `if: false`.
# A infra de staging ainda não existe — ver docs/modernization/ambiente-homologacao-futuro.md.
#
# Quando a infra existir, remova o `if: false`, preencha secrets/vars e descomente os passos.

name: Deploy staging (template)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para confirmar (quando o template estiver ativo)'
        required: false
        default: ''

jobs:
  staging:
    name: Deploy to staging (disabled)
    if: false
