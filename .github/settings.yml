# Synced by the Repository Settings GitHub App (https://github.com/apps/settings)
# when installed on this repository. Safe to keep as source of truth either way.

repository:
  # Short description shown on the GitHub repository page
  description: >-
    Plataforma web da UFMT para prospecção tecnológica, harmonização de patentes
    com Apache Lucene 9 e 13 relatórios interativos (Java 21, Jakarta EE 10,
    MongoDB e React).

  # Homepage (landing page / docs)
  homepage: https://brunomartinsmv.github.io/periscope/

  # Topics shown on the repository page (comma-separated or YAML list)
  topics:
    - patents
    - patent-analysis
    - industrial-property
    - ufmt
    - java
    - jakarta-ee
    - wildfly
    - mongodb
    - lucene
    - react
    - typescript
    - docker
    - rest-api
    - openapi

  default_branch: master
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
